# Apache HTTP Server configuration for the Laravel application.
# Adapted from the CC-Y1-WebDev apache-php-mysql template: the one
# change that matters is DocumentRoot pointing at Laravel's public/
# directory rather than the project root, since Laravel's front
# controller (index.php) lives there, not at the top level.

ServerName localhost

DirectoryIndex index.php index.html

DocumentRoot /var/www/html/public

<Directory /var/www/html/public>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
